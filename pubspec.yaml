name: restau_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"   

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.2.5
  http: ^0.13.6
  cupertino_icons: ^1.0.8
  flutterfire_cli: ^1.0.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/photo.png
    - assets/images/photo2.png
    - assets/images/customer.png   
    - assets/images/owner.png     
    - assets/images/Welcom.png
    - assets/images/Sign.png
    - assets/images/photo3.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/photo2.png"
  adaptive_icon_background: "#2E7D32" 
  adaptive_icon_foreground: "assets/images/photo2.png"